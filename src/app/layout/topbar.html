@defer (hydrate on idle; hydrate on interaction) {

    <span class="tb-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="1.5"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span id="today" class="date">{{ today() }}</span></span>
    <span class="tb-i tb-247"><i aria-hidden="true"></i>{{ i.t('topbar.1') }}</span>
  </div>
  <div class="tb-g">
    <span class="tb-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg><a class="cl" href="tel:920009088"><b class="ltr">920009088</b></a></span>
    <span class="tb-i mail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><a class="cl" href="mailto:Info&#64;Fuelapp.sa"><b class="ltr">Info&#64;Fuelapp.sa</b></a></span>

    <a class="tb-lang" [routerLink]="i.altLink()" [attr.lang]="i.other()" [attr.hreflang]="i.other()" (click)="remember()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>{{ i.other() === 'en' ? 'English' : 'العربية' }}</a>
  </div>
</div></div>
}
