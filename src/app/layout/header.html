<header class="hdr"><div class="wrap"><div class="hcard">
  <a class="brand" [routerLink]="i.link('home')"><img src="assets/logo-white.webp" width="46" height="46" alt=""><span><b>{{ i.t('header.1') }}</b><small>{{ i.t('header.2') }}</small></span></a>
  <nav class="nav" id="nav" [class.open]="open()" [attr.aria-label]="i.t('header.3')">
    <a [routerLink]="i.link('home')" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: true }" (click)="open.set(false)">{{ i.t('header.4') }}</a><a [routerLink]="i.link('about')" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: true }" (click)="open.set(false)">{{ i.t('header.5') }}</a><a [routerLink]="i.link('services')" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: true }" (click)="open.set(false)">{{ i.t('header.6') }}</a><a [routerLink]="i.link('platform')" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: true }" (click)="open.set(false)">{{ i.t('header.7') }}</a><a [routerLink]="i.link('coverage')" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: true }" (click)="open.set(false)">{{ i.t('header.8') }}</a><a [routerLink]="i.link('clients')" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: true }" (click)="open.set(false)">{{ i.t('header.9') }}</a><a [routerLink]="i.link('contact')" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: true }" (click)="open.set(false)">{{ i.t('header.10') }}</a>
    <a class="nav-lang" [routerLink]="i.altLink()" [attr.lang]="i.other()" [attr.hreflang]="i.other()" (click)="open.set(false)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>{{ i.other() === 'en' ? 'English' : 'العربية' }}</a>
  </nav>
  <a class="btn btn-o" [routerLink]="i.link('contact')">{{ i.t('header.11') }}</a>
  <button class="burger" id="burger" #burger type="button" [attr.aria-expanded]="open()" aria-controls="nav" [attr.aria-label]="i.t('header.12')" (click)="open.set(!open())">{{ open() ? '✕' : '☰' }}</button>
</div></div></header>
